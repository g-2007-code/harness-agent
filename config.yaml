llm:
  provider: deepseek
  model: deepseek-chat
  base_url: "https://api.deepseek.com"
max_turns: 20
governance:
  blocked_commands:
    - "rm -rf"
    - "git push --force"
    - "curl"
    - "wget"
    - "chmod 777"
    - "sudo"
  auto_deny: false
session:
  dir: ".harness/sessions"
logging:
  level: info
  dir: ".harness/logs"
